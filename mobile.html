<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>给贝贝的爱 💕</title>
  <link rel="stylesheet" href="mobile-styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💖</text></svg>">
</head>
<body>
  <!-- 背景粒子与流星 -->
  <canvas id="bg-canvas" aria-hidden="true"></canvas>

  <!-- 顶部 Hero -->
  <header class="hero" id="top">
    <div class="hero-inner glass">
      <h1 class="brand">
        <span id="yourName">给亲爱的贝贝</span>
      </h1>
      <p class="typewriter">
        <span id="typewriterText" data-lines='["贝贝，遇见你，是我所有美好故事的开始。","贝贝，今天，想把心里的话，慢慢说给你听。","贝贝，愿以后每一天，都有你。"]'></span>
        <span class="cursor">|</span>
      </p>
      <div class="cta">
        <button id="loveButton" class="btn-heart" aria-label="点击有惊喜">
          <span class="heart">❤</span>
          <span> 点我开启惊喜</span>
        </button>
      </div>
      <div class="meta">
        <span id="anniversary" title="纪念日">我们的第 <span id="daysCounter">0</span> 天</span>
      </div>
      <div class="mobile-hint">
        <p>💡 小提示：长按屏幕有惊喜哦</p>
        <p>📱 摇一摇手机试试看</p>
      </div>
    </div>
    <div class="scroll-hint">向下滑动</div>
  </header>

  <!-- 甜蜜弹窗 -->
  <dialog id="sweetDialog" class="sweet">
    <form method="dialog">
      <h3>给贝贝的一封小情书</h3>
      <p id="loveNote">贝贝，从遇见你开始，星星也有了归宿。</p>
      <menu>
        <button value="close" class="btn">收下</button>
      </menu>
    </form>
  </dialog>

  <!-- 记忆时间线 -->
  <section id="timeline" class="section">
    <h2 class="section-title">我们的时光</h2>
    <div class="timeline">
      <div class="tl-item reveal">
        <div class="tl-marker"></div>
        <div class="tl-content glass">
          <h4>第一次相遇</h4>
          <p>那一刻，世界都亮了</p>
          <img src="assets/memory1.jpg" alt="美好回忆" loading="lazy" />
        </div>
      </div>
      <div class="tl-item reveal">
        <div class="tl-marker"></div>
        <div class="tl-content glass">
          <h4>第一次约会</h4>
          <p>紧张又甜蜜的开始</p>
          <img src="assets/memory2.jpg" alt="美好回忆" loading="lazy" />
        </div>
      </div>
      <div class="tl-item reveal">
        <div class="tl-marker"></div>
        <div class="tl-content glass">
          <h4>在一起</h4>
          <p>从此，每一天都是情人节</p>
          <img src="assets/memory3.jpg" alt="美好回忆" loading="lazy" />
        </div>
      </div>
    </div>
  </section>

  <!-- 互动游戏 -->
  <section id="quiz" class="section">
    <h2 class="section-title">你了解我吗？</h2>
    <div class="quiz glass reveal">
      <p class="question">我最喜欢和你一起做什么？</p>
      <div class="options">
        <button class="opt" data-correct="true">A. 一起看电影</button>
        <button class="opt" data-correct="false">B. 逛街购物</button>
        <button class="opt" data-correct="false">C. 烧烤</button>
      </div>
      <div id="quizResult" class="result" aria-live="polite"></div>
    </div>
  </section>

  <!-- 隐藏彩蛋 -->
  <section id="easter" class="section hidden">
    <h2 class="section-title">隐藏的小惊喜</h2>
    <div class="easter glass">
      <p>被贝贝发现啦！给最厉害的贝贝，解锁一枚超大爱心！</p>
      <button id="megaHeart" class="btn-heart big">❤</button>
    </div>
  </section>

  <!-- 音乐播放器 -->
  <section id="music" class="section">
    <h2 class="section-title">我们的 BGM</h2>
    <div class="player glass">
      <audio id="audio" src="assets\陈柯宇 - 直到遇见了你,我只喜欢你.mp3" preload="auto" autoplay loop></audio>
      <div class="controls">
        <button id="play" class="btn">播放/暂停</button>
        <input id="volume" type="range" min="0" max="1" step="0.01" value="0.6" aria-label="音量" />
        <span id="trackName">直到遇见了你,我只喜欢你</span>
      </div>
    </div>
  </section>

  <!-- 页脚 -->
  <footer class="footer">
    <div class="glass">
      <p>Made with ❤ 只给贝贝</p>
      <small>小提示：试试双击屏幕</small>
    </div>
  </footer>

  <!-- 轻量弹窗与灯箱容器 -->
  <dialog id="lightbox" class="lightbox"><img alt="预览" id="lightboxImg" /><form method="dialog"><button class="btn">关闭</button></form></dialog>

  <script src="mobile-app.js"></script>
</body>
</html>
