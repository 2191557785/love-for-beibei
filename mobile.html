<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="format-detection" content="telephone=no">
  <title>给贝贝的爱 💕</title>
  <link rel="stylesheet" href="mobile-styles.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@300;400;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='0.9em' font-size='90'>💖</text></svg>">
</head>
<body>
  <!-- 主容器 -->
  <div class="app">
    <!-- 首屏 -->
    <section class="hero">
      <div class="hero-content">
        <h1 class="title">给亲爱的贝贝</h1>
        <div class="typewriter">
          <span id="typeText"></span>
          <span class="cursor">|</span>
        </div>
        <button class="love-btn" id="loveBtn">
          <span class="heart">💕</span>
          <span>点我有惊喜</span>
        </button>
        <div class="days">
          我们在一起的第 <span id="days">0</span> 天
        </div>
      </div>
      <div class="scroll-hint">
        <div class="arrow">↓</div>
        <span>向下滑动</span>
      </div>
    </section>

    <!-- 时光回忆 -->
    <section class="memories">
      <h2>我们的美好时光</h2>
      <div class="memory-grid">
        <div class="memory-card">
          <img src="assets/memory1.jpg" alt="回忆1">
          <div class="memory-text">
            <h3>第一次相遇</h3>
            <p>那一刻，世界都亮了</p>
          </div>
        </div>
        <div class="memory-card">
          <img src="assets/memory2.jpg" alt="回忆2">
          <div class="memory-text">
            <h3>第一次约会</h3>
            <p>紧张又甜蜜的开始</p>
          </div>
        </div>
        <div class="memory-card">
          <img src="assets/memory3.jpg" alt="回忆3">
          <div class="memory-text">
            <h3>在一起</h3>
            <p>从此，每一天都是情人节</p>
          </div>
        </div>
      </div>
    </section>

    <!-- 互动游戏 -->
    <section class="game">
      <h2>你了解我吗？</h2>
      <div class="quiz-card">
        <p class="question">我最喜欢和你一起做什么？</p>
        <div class="options">
          <button class="option" data-correct="true">一起看电影</button>
          <button class="option" data-correct="false">逛街购物</button>
          <button class="option" data-correct="false">烧烤聚餐</button>
        </div>
        <div class="result" id="result"></div>
      </div>
    </section>

    <!-- 音乐播放器 -->
    <section class="music">
      <h2>我们的BGM</h2>
      <div class="player">
        <audio id="audio" src="assets\陈柯宇 - 直到遇见了你,我只喜欢你.mp3" preload="auto" loop></audio>
        <div class="player-controls">
          <button class="play-btn" id="playBtn">▶️</button>
          <div class="track-info">
            <div class="track-name">直到遇见了你,我只喜欢你</div>
            <div class="volume-control">
              <span>🔊</span>
              <input type="range" id="volume" min="0" max="1" step="0.01" value="0.6">
            </div>
          </div>
        </div>
      </div>
    </section>

    <!-- 爱的告白 -->
    <section class="confession">
      <div class="confession-card">
        <h2>贝贝</h2>
        <div class="love-message">
          <p>从遇见你开始，星星也有了归宿。</p>
          <p>我会把所有的温柔和偏爱都给你。</p>
          <p>愿以后每一天，都有你。</p>
        </div>
        <button class="heart-btn" id="heartBtn">💖</button>
      </div>
    </section>

    <!-- 页脚 -->
    <footer class="footer">
      <p>Made with ❤️ 只给贝贝</p>
      <div class="hints">
        <p>💡 长按屏幕有惊喜</p>
        <p>📱 摇一摇试试看</p>
      </div>
    </footer>
  </div>

  <!-- 弹窗 -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modalTitle">给贝贝的小情书</h3>
      <p id="modalText">贝贝，从遇见你开始，星星也有了归宿。</p>
      <button class="modal-btn" id="modalClose">收下 💕</button>
    </div>
  </div>

  <!-- 特效容器 -->
  <div class="effects" id="effects"></div>

  <script src="mobile-app.js"></script>
</body>
</html>
